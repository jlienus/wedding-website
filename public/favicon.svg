<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
    <title>John &amp; Diana</title>
    <!-- Two interlocking wedding rings in champagne gold. The 32x32 viewBox
         + stroke-width 4 keeps the rings ~2px thick at 16x16 favicon size,
         which is what browsers actually render in tabs. -->
    <circle cx="10.5" cy="16" r="9" stroke="#A8842F" stroke-width="4" />
    <circle cx="21.5" cy="16" r="9" stroke="#D4AF37" stroke-width="4" />
</svg>
