name: Rotate RSVP Field Keys (monthly)

# Self-managed AES-256 key rotation for the encrypted PII fields in the
# rsvpInvites table. Runs the same script you'd run by hand. See
# scripts/rotate-field-keys.ps1 for the full procedure.
#
# Cadence: 1st of every month at 07:00 UTC (3am ET, comfortably outside
# wedding-window traffic). Manual trigger also supported.
#
# Auth: OIDC federated credential (no stored secret to expire). The Entra app
# "gh-wedding-rotate-keys" trusts token.actions.githubusercontent.com for
# subject repo:jlienus/wedding-website:ref:refs/heads/main.
#
# Its RBAC, scoped as tightly as the script needs:
#   Contributor                                on staticSites/swa-wedding
#   Storage Blob Data Reader                   on rg-wedding-swa
#   Storage Account Key Operator Service Role  on rg-wedding-swa
#
# Repo secrets consumed: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      propagation_sec:
        description: 'Seconds to wait after pushing new app settings before running the re-encrypt sweep'
        required: false
        default: '60'

permissions:
  contents: read
  id-token: write  # required for OIDC federated login to Azure

jobs:
  rotate:
    runs-on: ubuntu-latest
    concurrency: rsvp-field-key-rotation  # never two rotations at once
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install api/ deps (used by the re-encrypt sweep)
        run: |
          cd api
          npm ci --omit=dev

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rotate field keys + re-encrypt sweep
        shell: pwsh
        env:
          WEDDING_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $propagation = if ('${{ inputs.propagation_sec }}') { [int]'${{ inputs.propagation_sec }}' } else { 60 }
          ./scripts/rotate-field-keys.ps1 -Confirm:$false -PropagationSec $propagation
